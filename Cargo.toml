[package]
name = "identity-metadata-client"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description= "Client to access and manage public identity information."
repository = "https://github.com/dataspace-rs/identity-metadata-client"
keywords = ["dataspace", "http"]
categories = []
readme = "README.md"
authors = [
  "Marc-Antoine Arnaud <marc-antoine.arnaud@luminvent.com>",
]

[dependencies]
identity-metadata-commons = "0.2"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
